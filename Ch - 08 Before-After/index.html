<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before-After</title>
    <link rel="stylesheet" href="CSS/style.css" type="text/css" />
</head>

<body>

    <div class="heading">
        <h2> Multi-Effect UI Showcase</h2>
        <p>All sections styled without Flexbox</p>
    </div>

    <div class="profile-card">
        <h3>Layered Profile Cards</h3>

        <div class="inside1">

            <div class="photo">

            </div>
            <div class="info">
                <p class="name">Jagruti Jani</p>

                <p class="profession"> <i class="ri-code-s-slash-line"></i>
                    Full Stack Developer</p>

            </div>
        </div>

        <div class="inside2">

            <div class="photo">

            </div>
            <div class="info">
                <p class="name">Jagruti Jani</p>

                <p class="profession"> <i class="ri-code-s-slash-line"></i>
                    Full Stack Developer</p>

            </div>
        </div>

    </div>

    <div class="quiz-section">
        <h3>Quiz Flashcards</h3>

        <div class="quiz-container">
            <div class="flashcard">
                <h3 class="question">What is HTML?</h3>
                <h3 class="answer">HyperText Markup Language</h3>
            </div>

            <div class="flashcard">
                <h3 class="question">What is CSS?</h3>
                <h3 class="answer">Cascading Style Sheets</h3>
            </div>

        </div>


    </div>

    <div class="button-section">
        <h3>Creative Buttons</h3>

        <div class="button-container">
            <button class="slide-button">Slide Button</button>
            <button class="glow-button">Glow Button</button>
        </div>
    </div>

    <div class="gallery-section">
        <h3>Interactive Image Gallery</h3>

        <div class="image-gallery">
            <div class="image-box image1"></div>
            <div class="image-box image2"></div>
            <div class="image-box image3"></div>
        </div>
    </div>



</body>

</html>
