<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Video: Watch movies, TV shows, sports, and live TV</title>
    <link href="https://m.media-amazon.com/images/G/01/digital/video/DVUI/favicons/favicon.png" rel="shortcut icon"
        type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <link rel="stylesheet" href="CSS/style.css" type="text/css" />
</head>

<body>
    <header class="navbar">

        <!--LOGO SECTION-->
        <a href="#" class="logo">
            <img src="https://m.media-amazon.com/images/G/01/digital/video/web/logo-min-remaster.png"
                alt="Prime logo" />
        </a>

        <!--NAVIGATION SECTION-->
        <nav class="nav-links">
            <a href="#" class="nav-link">Home</a>
            <a href="#" class="nav-link">Free to me</a>
            <a href="#" class="nav-link">Movies</a>
            <a href="#" class="nav-link">TV shows</a>
            <a href="#" class="nav-link">Live TV</a>

            <span class="nav-divider"></span>

            <a href="#" class="nav-link"> <i class="ri-function-add-line"></i>Subscription</a>
            <a href="#" class="nav-link"> <i class="ri-handbag-line"></i>Stores</a>
        </nav>

        <!-- ACTION SECTION -->
        <div class="nav-action">
            <button class="icon-btn"><i class="ri-search-line"></i></button>
            <button class="lang-btn">EN <i class="ri-arrow-down-s-line"></i></button>
            <button class="icon-btn"><i class="ri-grid-fill"></i></button>
            <button class="icon-btn">
                <div class="profile">
                    <i class="ri-user-line"></i>
                </div>
            </button>

            <a href="#" class="join-btn">Join Prime</a>
        </div>
    </header>

    <main>
        <section class="hero">
            <img class="hero-prime"
                src="https://m.media-amazon.com/images/G/01/digital/video/merch/subs/benefit-id/m-r/Prime/logos/channels-logo-white-originals._CB757620342_BR-6_AC_SX750_FMwebp_.png"
                alt="prime original">

            <img class="hero-movie"
                src="https://m.media-amazon.com/images/S/sonata-images-prod/PV_IN_ChaarYaar_S1_JP26_HuggingArt/11aa2dce-9925-4ea7-8350-58ad4287f2fd._BR-6_AC_SX1500_FMwebp_.png"
                alt="movie image">

            <p class="hero-available"> <i class="ri-megaphone-line"></i>All episodes available</p>

            <div class="hero-description">
                <p>Season 1・Chaar Yaar is a story of four middle-class boys - typical 'Mumbai ke
                    chokre' - their friendship and their...</p>
            </div>

            <div class="all-btn">
                <button class="join-prime-btn"><a href="">Join Prime Watch now</a></button>

                <button class="round-btn"> <i class="ri-add-large-line"></i></button>

                <button class="round-btn"> <i class="ri-information-line"></i></button>

            </div>

            <p class="hero-free-episode">First episode free</p>

        </section>
    </main>


</body>

</html>
