<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background</title>
    <link rel="stylesheet" href="css/style.css" type="text/css" />
</head>

<body>

    <div class="banner">
        <p> Welcome to the Parallax World</p>
    </div>

    <div class="linear">
        Linear Gradient Section
    </div>
    <div class="radial">
        Radial Gradient Section
    </div>
    <div class="conic">
        Conic Gradient Section
    </div>

    <div class="section">
        <span>This Block uses two classes :
            <span class="text-block"> text-block </span> and
            <span class="highlight">
                highlight. </span>
        </span>

    </div>

    <div class="final">
        <h2>Parent Box Heading</h2>
        <span>This paragraph is a child element styled inside the parent.</span>

    </div>

</body>

</html>
